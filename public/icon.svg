<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Background (Rounded squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#gradBg)" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="12 12" />

  <!-- Medication Capsule Pill -->
  <g filter="url(#shadow)" transform="rotate(-30 256 256)">
    <!-- Pill Left Half (White) -->
    <path d="M 140 206 C 140 150 185 106 240 106 L 256 106 L 256 406 L 240 406 C 185 406 140 362 140 306 Z" fill="#ffffff" />
    
    <!-- Medical Cross on White Half -->
    <path d="M 200 236 L 200 200 L 220 200 L 220 236 L 244 236 L 244 256 L 220 256 L 220 292 L 200 292 L 200 256 L 176 256 L 176 236 Z" fill="#059669" />

    <!-- Pill Right Half (Teardrop / Emerald) -->
    <path d="M 256 106 L 272 106 C 327 106 372 150 372 206 L 372 306 C 372 362 327 406 272 406 L 256 406 Z" fill="url(#pillGrad)" />

    <!-- Pill Divider Line -->
    <line x1="256" y1="106" x2="256" y2="406" stroke="#047857" stroke-width="4" stroke-opacity="0.3" />

    <!-- Pill Sparkle / Shine -->
    <path d="M 285 140 Q 345 180 345 250" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.4" />
  </g>
</svg>
